<!doctype html>

  <head>
    <script>
      // Lite mode for weak devices (e.g. smartboards): ?lite=1 enables (remembered), ?lite=0 disables
      (function() {
        try {
          var lite = new URLSearchParams(window.location.search).get("lite");
          if (lite === "1") localStorage.setItem("lite-mode", "1");
          if (lite === "0") localStorage.removeItem("lite-mode");
          if (localStorage.getItem("lite-mode") === "1") {
            document.documentElement.classList.add("lite");
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var cachedTheme = localStorage.getItem("active-theme-data");
          if (cachedTheme) {
            var theme = JSON.parse(cachedTheme);
            var root = document.documentElement;
            if (theme) {
              if (theme.colors) {
                Object.keys(theme.colors).forEach(function(key) {
                  root.style.setProperty("--" + key, theme.colors[key]);
                });
              }
              if (theme.backgroundPattern && theme.backgroundPattern !== "none") {
                root.style.setProperty("--background-pattern", theme.backgroundPattern);
              } else {
                root.style.setProperty("--background-pattern", "none");
              }
            }
          }
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
